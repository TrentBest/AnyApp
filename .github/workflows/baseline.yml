name: AnyApp Baseline

on:
  workflow_dispatch:
  push:
    branches: [ "master", "development" ]

jobs:
  publish-baseline:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Checkout MicroBundleDomain dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
        ref: architecture/runtime-contract-ownership
        path: _dependencies/MicroBundleDomain

    - name: Checkout FSM_COS dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.FSM_COS
        ref: architecture/domain-owned-microbundle-contract
        path: _dependencies/FSM_COS

    - name: Checkout MicroBundleRepository dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleRepository
        ref: master
        path: _dependencies/MicroBundleRepository

    - name: Pack local composition dependencies
      shell: pwsh
      run: |
        dotnet restore _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx
        dotnet build _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx --configuration Release --no-restore

        New-Item -ItemType Directory -Force -Path _dependencies/nuget | Out-Null
        dotnet pack _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Add local dependency feed
      shell: pwsh
      run: dotnet nuget add source "$env:GITHUB_WORKSPACE/_dependencies/nuget" --name CompositionDependenciesLocal

    - name: Pack corrected FSM_COS dependency
      shell: pwsh
      run: |
        dotnet restore _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln
        dotnet build _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln --configuration Release --no-restore
        dotnet pack _dependencies/FSM_COS/src/FSM_COS/FSM_COS.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Pack MicroBundleRepository dependency
      shell: pwsh
      run: |
        dotnet restore _dependencies/MicroBundleRepository/TheSingularityWorkshop.MicroBundleRepository.slnx
        dotnet build _dependencies/MicroBundleRepository/TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore
        dotnet pack _dependencies/MicroBundleRepository/src/Core/TheSingularityWorkshop.MicroBundleRepository.Core/TheSingularityWorkshop.MicroBundleRepository.Core.csproj --configuration Release --no-build --output _dependencies/nuget
        dotnet pack _dependencies/MicroBundleRepository/src/REST/TheSingularityWorkshop.MicroBundleRepository.Rest/TheSingularityWorkshop.MicroBundleRepository.Rest.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Restore
      run: dotnet restore AnyApp.csproj

    - name: Publish framework-dependent
      run: dotnet publish AnyApp.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/framework-dependent --no-restore

    - name: Publish self-contained
      run: dotnet publish AnyApp.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/self-contained --no-restore

    - name: Publish single-file self-contained
      run: dotnet publish AnyApp.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/single-file --no-restore

    - name: Publish trimmed single-file (experimental)
      continue-on-error: true
      run: dotnet publish AnyApp.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output artifacts/single-file-trimmed --no-restore

    - name: Measure outputs
      shell: pwsh
      run: |
        $summary = @()
        $summary += '# AnyApp publish baseline'
        $summary += ''
        $summary += '| Configuration | Directory size | EXE size | EXE |'
        $summary += '|---|---:|---:|---|'

        foreach ($dir in @('framework-dependent', 'self-contained', 'single-file', 'single-file-trimmed')) {
          $path = Join-Path $PWD "artifacts/$dir"
          if (-not (Test-Path $path)) { continue }

          $files = Get-ChildItem $path -Recurse -File
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          $exe = $files | Where-Object Extension -eq '.exe' | Sort-Object Length -Descending | Select-Object -First 1
          $directorySize = '{0:N2} MB' -f ($bytes / 1MB)
          $exeSize = if ($exe) { '{0:N2} MB' -f ($exe.Length / 1MB) } else { 'n/a' }
          $exeName = if ($exe) { $exe.Name } else { 'n/a' }
          $summary += "| $dir | $directorySize | $exeSize | $exeName |"
        }

        $summary += ''
        $summary += 'These measurements are the physical baseline for the current AnyApp composition slice. They are intentionally kept separate from FSM_COS semantics.'
        $summary | Tee-Object -FilePath baseline.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
        Get-Content baseline.md

    - name: Upload publish outputs
      uses: actions/upload-artifact@v5
      with:
        name: anyapp-publish-baseline
        path: |
          artifacts/
          baseline.md
        if-no-files-found: error