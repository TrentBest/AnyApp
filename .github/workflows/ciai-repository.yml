name: CiAi Repository Contract

on:
  push:
    branches: [master, development, integration/ciai-repository-contract]
    paths:
      - '**/README.md'
      - '.ciai/repository.json'
      - '.github/workflows/ciai-repository.yml'
  pull_request:
    branches: [development]
    paths:
      - '**/README.md'
      - '.ciai/repository.json'
      - '.github/workflows/ciai-repository.yml'

permissions:
  contents: read

jobs:
  repository:
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/ciai-repository.yml@ade96a15bf3e97659c62a1aac3339179c872b9a5
    with:
      ciai-ref: ade96a15bf3e97659c62a1aac3339179c872b9a5
