name: .NET

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:
  build:
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'development') || github.ref == 'refs/heads/development' }}
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Checkout Experiences dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Experiences
        ref: development
        path: _dependencies/Experiences

    - name: Checkout FSM_UserIO source dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/FSM_UserIO
        ref: development
        path: _dependencies/FSM_UserIO

    - name: Checkout FSM_REST source dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.FSM_REST
        ref: development
        path: _dependencies/TheSingularityWorkshop.FSM_REST

    - name: Checkout GrammarAi source dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.GrammarAi
        ref: development
        path: _dependencies/TheSingularityWorkshop.GrammarAi

    - name: Checkout GUI source dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.GUI
        ref: development
        path: _dependencies/TheSingularityWorkshop.GUI

    - name: Checkout StoryBuilder source dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/StoryBuilder
        ref: development
        path: _dependencies/StoryBuilder

    - name: Checkout FSM_API source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/FSM_API
        ref: development
        path: _dependencies/FSM_API

    - name: Checkout ProtocolAi source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.ProtocolAi
        ref: development
        path: _dependencies/TheSingularityWorkshop.ProtocolAi

    - name: Checkout MicroBundleDomain source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
        ref: development
        path: _dependencies/TheSingularityWorkshop.MicroBundleDomain

    - name: Checkout Renderer dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Renderer
        ref: development
        path: _dependencies/TheSingularityWorkshop.Renderer

    - name: Checkout Visualize dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Visualize
        ref: development
        path: _dependencies/TheSingularityWorkshop.Visualize

    - name: Checkout MicroBundleDomain dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
        ref: development
        path: _dependencies/MicroBundleDomain

    - name: Checkout FSM_COS dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.FSM_COS
        ref: development
        path: _dependencies/TheSingularityWorkshop.FSM_COS

    - name: Checkout MicroBundleRepository dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleRepository
        ref: development
        path: _dependencies/MicroBundleRepository

    - name: Restore Renderer source dependency graph
      shell: pwsh
      run: dotnet restore _dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$env:GITHUB_WORKSPACE/_dependencies"

    - name: Diagnose Renderer source references
      shell: pwsh
      run: |
        $renderer = "_dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        dotnet msbuild $renderer -getProperty:Configuration,WorkshopUseRepositorySources,WorkshopSourceRoot -getItem:ProjectReference,PackageReference -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"
        dotnet msbuild $renderer -t:ResolveReferences -getItem:ResolvedProjectReferencePaths,ReferencePath -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Build Renderer source graph in Release
      shell: pwsh
      run: |
        $log = "renderer-build-diag.log"
        dotnet build _dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj --configuration Release --no-restore --verbosity diagnostic -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$env:GITHUB_WORKSPACE/_dependencies" *> $log
        $buildExitCode = $LASTEXITCODE
        Write-Host "---- Renderer compiler/reference evidence ----"
        Select-String -Path $log -Pattern 'Task "Csc"|Csc.*(CommandLineArguments|References)|FSM_API\.dll|TheSingularityWorkshop\.MicroBundleDomain\.dll|TheSingularityWorkshop\.ProtocolAi\.dll|error CS' | Select-Object -Last 160
        if ($buildExitCode -ne 0) {
          Write-Host "Renderer source graph build failed; full diagnostic log retained as workflow artifact only if uploaded separately."
          exit $buildExitCode
        }

    - name: Restore AnyApp test graph in repository-source mode
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        dotnet restore tests/TheSingularityWorkshop.AnyApp.Tests/TheSingularityWorkshop.AnyApp.Tests.csproj -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot" "-p:WorkshopGuiCoreProject=$guiCoreProject"

    - name: Restore Renderer adapter in source mode
      shell: pwsh
      run: |
        $adapter = "_dependencies/TheSingularityWorkshop.Visualize/integrations/RendererAdapter/TheSingularityWorkshop.Renderer.VisualizeAdapter.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        dotnet restore $adapter -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Diagnose Renderer adapter reference graph
      shell: pwsh
      run: |
        $adapter = "_dependencies/TheSingularityWorkshop.Visualize/integrations/RendererAdapter/TheSingularityWorkshop.Renderer.VisualizeAdapter.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        # Inspect declared adapter references without invoking ResolveReferences, which may compile
        # dependency projects as a side effect. The actual source-graph builds below remain authoritative.
        dotnet msbuild $adapter -getProperty:Configuration,WorkshopUseRepositorySources,WorkshopSourceRoot,WorkshopRendererProjectPath -getItem:ProjectReference,PackageReference -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Build AnyApp in the same repository-source mode used for restore
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        dotnet build AnyApp.csproj --configuration Release --no-restore -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot" "-p:WorkshopGuiCoreProject=$guiCoreProject"

    - name: Test AnyApp in the same repository-source mode used for restore
      id: test-anyapp
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        dotnet test tests/TheSingularityWorkshop.AnyApp.Tests/TheSingularityWorkshop.AnyApp.Tests.csproj --configuration Release --no-restore --verbosity normal -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot" "-p:WorkshopGuiCoreProject=$guiCoreProject"

    - name: Restore AnyApp Windows self-contained publish graph
      id: restore-windows-publish
      if: success() || steps.test-anyapp.outcome == 'failure'
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        dotnet restore AnyApp.csproj --runtime win-x64 -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot" "-p:WorkshopGuiCoreProject=$guiCoreProject"

    - name: Publish Windows x64 single-file executable
      id: publish-windows-exe
      if: success() || (steps.test-anyapp.outcome == 'failure' && steps.restore-windows-publish.outcome == 'success')
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        dotnet publish AnyApp.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot" "-p:WorkshopGuiCoreProject=$guiCoreProject" --output artifacts/windows-x64

    - name: Measure Windows executable
      id: measure-windows-exe
      if: success() || (steps.test-anyapp.outcome == 'failure' && steps.publish-windows-exe.outcome == 'success')
      shell: pwsh
      run: |
        $exe = Get-Item "artifacts/windows-x64/AnyApp.exe" -ErrorAction Stop
        $directoryBytes = (Get-ChildItem "artifacts/windows-x64" -Recurse -File | Measure-Object -Property Length -Sum).Sum
        $exeMb = [math]::Round($exe.Length / 1MB, 2)
        $directoryMb = [math]::Round($directoryBytes / 1MB, 2)
        $summary = @(
          "# AnyApp Windows x64 development artifact"
          ""
          "| Measurement | Size |"
          "|---|---:|"
          "| Executable | $exeMb MB ($($exe.Length) bytes) |"
          "| Publish directory | $directoryMb MB ($directoryBytes bytes) |"
          ""
          "Commit: $env:GITHUB_SHA"
          "Runtime: win-x64"
          "Deployment: self-contained, single-file"
          "Configuration: Release"
        )
        $summary | Tee-Object -FilePath anyapp-artifact-size.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
        Get-Content anyapp-artifact-size.md

    - name: Upload Windows executable artifact
      if: success() || (steps.test-anyapp.outcome == 'failure' && steps.measure-windows-exe.outcome == 'success')
      uses: actions/upload-artifact@v5
      with:
        name: AnyApp-win-x64-${{ github.sha }}
        path: |
          artifacts/windows-x64/AnyApp.exe
          anyapp-artifact-size.md
        if-no-files-found: error
        retention-days: 30
    
    - name: Publish controlled size profiles
      if: success()
      shell: pwsh
      run: |
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        $guiCoreProject = Join-Path $sourceRoot "TheSingularityWorkshop.GUI/src/Core/TheSingularityWorkshop.GUI.Core.csproj"
        $profiles = @(
          @{ Name = "baseline"; Compression = $false; EnglishSatellitesOnly = $false },
          @{ Name = "compression-only"; Compression = $true; EnglishSatellitesOnly = $false },
          @{ Name = "satellite-language-only"; Compression = $false; EnglishSatellitesOnly = $true },
          @{ Name = "compression-and-satellite-language"; Compression = $true; EnglishSatellitesOnly = $true }
        )

        foreach ($profile in $profiles) {
          $output = "artifacts/size-matrix/$($profile.Name)"
          $arguments = @(
            "publish", "AnyApp.csproj",
            "--configuration", "Release",
            "--runtime", "win-x64",
            "--self-contained", "true",
            "--no-restore",
            "-p:PublishSingleFile=true",
            "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:EnableCompressionInSingleFile=$($profile.Compression.ToString().ToLowerInvariant())",
            "-p:WorkshopUseRepositorySources=true",
            "-p:WorkshopSourceRoot=$sourceRoot",
            "-p:WorkshopGuiCoreProject=$guiCoreProject",
            "--output", $output
          )
          if ($profile.EnglishSatellitesOnly) {
            $arguments += "-p:SatelliteResourceLanguages=en"
          }

          Write-Host "Publishing profile: $($profile.Name)"
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Publish failed for profile '$($profile.Name)' with exit code $LASTEXITCODE."
          }
        }

    - name: Measure controlled size profiles
      if: success()
      shell: pwsh
      run: |
        $names = @("baseline", "compression-only", "satellite-language-only", "compression-and-satellite-language")
        $measurements = @()
        $fileInventories = @{}

        foreach ($name in $names) {
          $directory = "artifacts/size-matrix/$name"
          $files = @(Get-ChildItem $directory -Recurse -File | Sort-Object FullName)
          $exe = Get-Item (Join-Path $directory "AnyApp.exe") -ErrorAction Stop
          $directoryBytes = [long](($files | Measure-Object -Property Length -Sum).Sum)
          $measurements += [pscustomobject]@{
            Profile = $name
            ExeBytes = [long]$exe.Length
            DirectoryBytes = $directoryBytes
          }

          $rows = @("## $name", "", "| File | Bytes |", "|---|---:|")
          foreach ($file in $files) {
            $relative = $file.FullName.Substring((Resolve-Path $directory).Path.Length).TrimStart('\','/')
            $rows += "| $relative | $($file.Length) |"
          }
          $fileInventories[$name] = $rows
        }

        $baseline = $measurements | Where-Object Profile -eq "baseline" | Select-Object -First 1
        $report = @(
          "# AnyApp publish size experiment",
          "",
          "Commit: $env:GITHUB_SHA",
          "Runtime: win-x64",
          "Deployment: Release, self-contained, single-file",
          "Compression: EnableCompressionInSingleFile",
          "Language filter: SatelliteResourceLanguages=en (satellite assemblies only)",
          "",
          "| Profile | EXE bytes | EXE MiB | Directory bytes | Directory MiB | EXE delta bytes | Directory delta bytes |",
          "|---|---:|---:|---:|---:|---:|---:|"
        )

        foreach ($item in $measurements) {
          $exeMiB = [math]::Round($item.ExeBytes / 1MB, 2)
          $dirMiB = [math]::Round($item.DirectoryBytes / 1MB, 2)
          $exeDelta = $item.ExeBytes - $baseline.ExeBytes
          $dirDelta = $item.DirectoryBytes - $baseline.DirectoryBytes
          $report += "| $($item.Profile) | $($item.ExeBytes) | $exeMiB | $($item.DirectoryBytes) | $dirMiB | $exeDelta | $dirDelta |"
        }

        foreach ($name in $names) {
          $report += ""
          $report += $fileInventories[$name]
        }

        $report | Set-Content -Path "publish-size-report.md" -Encoding utf8
        Get-Content "publish-size-report.md"
        Get-Content "publish-size-report.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Upload controlled size profiles
      if: success()
      uses: actions/upload-artifact@v5
      with:
        name: AnyApp-publish-size-matrix-${{ github.sha }}
        path: |
          artifacts/size-matrix/
          publish-size-report.md
        if-no-files-found: error
        retention-days: 30

