name: .NET

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Checkout Experiences dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Experiences
        ref: development
        path: _dependencies/Experiences

    - name: Checkout FSM_API source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/FSM_API
        ref: development
        path: _dependencies/FSM_API

    - name: Checkout ProtocolAi source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.ProtocolAi
        ref: development
        path: _dependencies/TheSingularityWorkshop.ProtocolAi

    - name: Checkout MicroBundleDomain source dependency for Renderer
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
        ref: development
        path: _dependencies/TheSingularityWorkshop.MicroBundleDomain

    - name: Checkout Renderer dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Renderer
        ref: development
        path: _dependencies/TheSingularityWorkshop.Renderer

    - name: Checkout Visualize dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.Visualize
        ref: development
        path: _dependencies/TheSingularityWorkshop.Visualize

    - name: Checkout MicroBundleDomain dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
        ref: development
        path: _dependencies/MicroBundleDomain

    - name: Checkout FSM_COS dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.FSM_COS
        ref: development
        path: _dependencies/FSM_COS

    - name: Checkout MicroBundleRepository dependency
      uses: actions/checkout@v5
      with:
        repository: TrentBest/TheSingularityWorkshop.MicroBundleRepository
        ref: development
        path: _dependencies/MicroBundleRepository

    - name: Restore Renderer source dependency graph
      shell: pwsh
      run: dotnet restore _dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$env:GITHUB_WORKSPACE/_dependencies"

    - name: Diagnose Renderer source references
      shell: pwsh
      run: |
        $renderer = "_dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        dotnet msbuild $renderer -getProperty:Configuration,WorkshopUseRepositorySources,WorkshopSourceRoot -getItem:ProjectReference,PackageReference -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"
        dotnet msbuild $renderer -t:ResolveReferences -getItem:ResolvedProjectReferencePaths,ReferencePath -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Build Renderer source graph in Release
      shell: pwsh
      run: |
        $log = "renderer-build-diag.log"
        dotnet build _dependencies/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.csproj --configuration Release --no-restore --verbosity diagnostic -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$env:GITHUB_WORKSPACE/_dependencies" *> $log
        $buildExitCode = $LASTEXITCODE
        Write-Host "---- Renderer compiler/reference evidence ----"
        Select-String -Path $log -Pattern 'Task "Csc"|Csc.*(CommandLineArguments|References)|FSM_API\.dll|TheSingularityWorkshop\.MicroBundleDomain\.dll|TheSingularityWorkshop\.ProtocolAi\.dll|error CS' | Select-Object -Last 160
        if ($buildExitCode -ne 0) {
          Write-Host "Renderer source graph build failed; full diagnostic log retained as workflow artifact only if uploaded separately."
          exit $buildExitCode
        }

    - name: Pack local composition dependencies
      shell: pwsh
      run: |
        dotnet restore _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx
        dotnet build _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx --configuration Release --no-restore

        New-Item -ItemType Directory -Force -Path _dependencies/nuget | Out-Null
        dotnet pack _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Add local dependency feed
      shell: pwsh
      run: dotnet nuget add source "$env:GITHUB_WORKSPACE/_dependencies/nuget" --name CompositionDependenciesLocal

    - name: Pack corrected FSM_COS dependency
      shell: pwsh
      run: |
        dotnet restore _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln
        dotnet build _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln --configuration Release --no-restore
        dotnet pack _dependencies/FSM_COS/src/FSM_COS/FSM_COS.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Pack MicroBundleRepository dependency
      shell: pwsh
      run: |
        dotnet restore _dependencies/MicroBundleRepository/TheSingularityWorkshop.MicroBundleRepository.slnx
        dotnet build _dependencies/MicroBundleRepository/TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore
        dotnet pack _dependencies/MicroBundleRepository/src/Core/TheSingularityWorkshop.MicroBundleRepository.Core/TheSingularityWorkshop.MicroBundleRepository.Core.csproj --configuration Release --no-build --output _dependencies/nuget
        dotnet pack _dependencies/MicroBundleRepository/src/REST/TheSingularityWorkshop.MicroBundleRepository.Rest/TheSingularityWorkshop.MicroBundleRepository.Rest.csproj --configuration Release --no-build --output _dependencies/nuget

    - name: Restore AnyApp test graph
      run: dotnet restore tests/TheSingularityWorkshop.AnyApp.Tests/TheSingularityWorkshop.AnyApp.Tests.csproj

    - name: Restore Renderer adapter in source mode
      shell: pwsh
      run: |
        $adapter = "_dependencies/TheSingularityWorkshop.Visualize/integrations/RendererAdapter/TheSingularityWorkshop.Renderer.VisualizeAdapter.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        dotnet restore $adapter -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Diagnose Renderer adapter reference graph
      shell: pwsh
      run: |
        $adapter = "_dependencies/TheSingularityWorkshop.Visualize/integrations/RendererAdapter/TheSingularityWorkshop.Renderer.VisualizeAdapter.csproj"
        $sourceRoot = "$env:GITHUB_WORKSPACE/_dependencies"
        dotnet msbuild $adapter -getProperty:Configuration,WorkshopUseRepositorySources,WorkshopSourceRoot,WorkshopRendererProjectPath -getItem:ProjectReference,PackageReference -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"
        dotnet msbuild $adapter -t:ResolveReferences -getItem:ReferencePath -p:Configuration=Release -p:WorkshopUseRepositorySources=true -p:WorkshopSourceRoot="$sourceRoot"

    - name: Build
      run: dotnet build AnyApp.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/TheSingularityWorkshop.AnyApp.Tests/TheSingularityWorkshop.AnyApp.Tests.csproj --configuration Release --no-restore --verbosity normal
