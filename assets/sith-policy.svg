<svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" role="img" aria-labelledby="title desc">
  <title id="title">Sith Policy: COMPLIANT</title>
  <desc id="desc">THE DUEL CONTINUES. 2 branches · master + development. When compliant, the Sith Lord and apprentice duel endlessly in the training ground; when in violation, the ground is empty.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b3a"/><stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .arena { transform-origin:48px 61px; animation: breathe 4s ease-in-out infinite; }
    .duel { transform-origin:48px 57px; animation: clash 2.8s ease-in-out infinite alternate; }
    @keyframes breathe { 0%,100% { opacity:.7; } 50% { opacity:1; } }
    @keyframes clash { from { transform:translateX(-2px) rotate(-2deg); } to { transform:translateX(2px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .arena,.duel { animation:none; } }
  </style>
  <rect x="1" y="1" width="438" height="102" rx="14" fill="url(#metal)" stroke="#36d399" stroke-opacity=".8" stroke-width="1.5"/>
  <g class="arena">
    <path d="M7 75 Q48 95 89 75 L89 83 Q48 101 7 83 Z" fill="#0b1020" stroke="#36d399" stroke-opacity=".5"/>
    <ellipse cx="48" cy="65" rx="42" ry="23" fill="none" stroke="#36d399" stroke-width="1.2" stroke-dasharray="3 4" opacity=".75"/>
    
      <g class="duel">
        <path d="M13 72 Q48 83 83 72" fill="none" stroke="#64748b" stroke-width="1.5"/>
        <path d="M24 70 L29 52 L36 48 L43 56 L45 72 Z" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>
        <path d="M31 49 L28 40 L36 35 L43 41 L41 50 Z" fill="#e2e8f0"/>
        <path d="M59 72 L61 55 L68 48 L76 53 L81 72 Z" fill="#7c879b" stroke="#cbd5e1" stroke-width="1"/>
        <path d="M61 48 L60 39 L68 34 L76 40 L73 50 Z" fill="#94a3b8"/>
        <path d="M37 48 L57 29" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M66 47 L45 28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M33 51 L39 57 M63 52 L70 57" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
        <circle cx="48" cy="29" r="3" fill="#fff" opacity=".9"/>
      </g>
  </g>
  <text x="108" y="31" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE SINGULARITY WORKSHOP</text>
  <text x="108" y="56" fill="#36d399" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing=".4">THE DUEL CONTINUES</text>
  <text x="108" y="77" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="11">2 branches · master + development</text>
  <text x="420" y="94" fill="#64748b" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="8">SITH POLICY · LIVE EVALUATION</text>
</svg>
